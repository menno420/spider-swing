# Spider Swing — Android debug APK.
#
# HOST-OWNED. Not generated by the Substrate Kit; edit it directly.
#
# Purpose: put an installable, source-identified debug APK in the owner's hands
# for gameplay pull requests and every change to main, so the GDD's feel gates
# (which can only be judged on a real device) are actually reachable. See ADR 0003.
#
# NOT a required merge check, deliberately: it depends on external SDK downloads,
# so making it required would turn a third-party outage into a merge block.
#
# SECRETS: this workflow reads NONE. Debug signing uses the stable conventional
# key committed at .github/android/debug.keystore so consecutive APKs update in
# place and preserve local saves. The key and credentials are public by design.
# It must NEVER be reused for Google Play, a release build, production signing,
# or any signed distribution. No release signing exists here and this workflow
# never publishes to Google Play.
#
# Every `uses:` is pinned to a full commit SHA resolved from the upstream
# repository's own git ref, with the release tag in a trailing comment.
name: android-debug

on:
  pull_request:
    paths:
      - 'game/**'
      - 'tests/**'
      - 'assets/runtime/audio/**'
      - 'tools/generate_audio_samples.py'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-debug.yml'
      - '.github/android/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1
  APK_PATH: build/spider-swing-debug.apk
  ARTIFACT_NAME: spider-swing-android-debug
  BUILD_VERSION: 0.22.0-audio-playtest
  APP_NAME: Spider Swing Audio Playtest (dev)
  DEBUG_KEYSTORE_PATH: .github/android/debug.keystore
  DEBUG_KEYSTORE_SHA256: e9104672477e0238b6cc2f7d6b994c459e37f130cae06a37aff05001f101bbda
  DEBUG_CERT_SHA256: 83ff0bc27903351779ffd1439f115e8c7e4c228fddd683e2a801c9700b30a741
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  android-debug:
    name: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the engine pin matches this workflow
        run: |
          pinned="$(tr -d '[:space:]' < .godot-version)"
          echo "pinned by .godot-version: $pinned"
          if [ "$pinned" != "${GODOT_VERSION}" ]; then
            echo "::error::.godot-version says '$pinned' but android-debug.yml installs ${GODOT_VERSION}. Update both in the same change."
            exit 1
          fi

      - name: Set up JDK 17
        # Godot's current Android export documentation recommends JDK 17.
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        # Provides cmdline-tools, platform-tools, and build-tools. Godot needs
        # apksigner and zipalign from build-tools to sign and align the APK.
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Godot ${{ env.GODOT_VERSION }} Standard with export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.1
          # Standard build: GDScript only (ADR 0001).
          use-dotnet: false
          # Required here: the export needs the Android APK template.
          include-templates: true
          cache: true

      - name: Report toolchain versions
        run: |
          godot --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

      - name: Assert the visible and Android build identities
        run: |
          set -euo pipefail
          grep -F "config/version=\"${BUILD_VERSION}\"" project.godot
          grep -F "version/name=\"${BUILD_VERSION}\"" export_presets.cfg
          grep -F 'version/code=40' export_presets.cfg
          grep -F "package/name=\"${APP_NAME}\"" export_presets.cfg
          echo "build identity: ${BUILD_VERSION} @ ${SOURCE_SHA}"

      - name: Assert the stable debug-only signing identity
        # This public key is stable solely so development APKs update in place.
        # Rotating it forces another uninstall; using it for distribution would
        # be insecure. Release signing remains deliberately absent.
        run: |
          set -euo pipefail
          test -f "${DEBUG_KEYSTORE_PATH}"
          actual_sha="$(sha256sum "${DEBUG_KEYSTORE_PATH}" | cut -d' ' -f1)"
          if [ "${actual_sha}" != "${DEBUG_KEYSTORE_SHA256}" ]; then
            echo "::error::stable debug keystore digest changed; this would break in-place installs"
            exit 1
          fi
          keytool -list \
            -keystore "${DEBUG_KEYSTORE_PATH}" \
            -storepass android \
            -alias androiddebugkey
          echo "WARNING: public debug key only; NEVER use for Play, release, or distribution."

      - name: Export the Android Debug preset
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/${{ env.DEBUG_KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build
          {
            echo "version=${BUILD_VERSION}"
            echo "source_sha=${SOURCE_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "package=com.menno420.spiderswing.dev"
            echo "display_name=${APP_NAME}"
            echo "debug_key_sha256=${DEBUG_KEYSTORE_SHA256}"
            echo "install_note=First stable-key install needs one final uninstall; later builds update in place and preserve data."
          } > build/build-info.txt

          # Import first, as a separate step. A cold export that also has to
          # import can report an import failure as an export failure, which is a
          # confusing log to debug.
          godot --headless --path . --import

          # Uses the committed "Android Debug" preset by exact name.
          godot --headless --path . --export-debug "Android Debug" "${APK_PATH}"

      - name: Prove the APK exists and is a real APK
        run: |
          set -euo pipefail
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::export reported success but ${APK_PATH} does not exist"
            ls -la build || true
            exit 1
          fi
          size="$(stat -c%s "${APK_PATH}")"
          echo "APK: ${APK_PATH} (${size} bytes)"
          # A truncated or placeholder file is worse than a missing one: it
          # uploads as a green artifact that will not install.
          if [ "${size}" -lt 1000000 ]; then
            echo "::error::${APK_PATH} is only ${size} bytes — implausibly small for a Godot APK"
            exit 1
          fi
          # An APK is a zip; prove the archive is intact and carries a manifest.
          unzip -l "${APK_PATH}" | head -20
          if ! unzip -l "${APK_PATH}" | grep -q AndroidManifest.xml; then
            echo "::error::${APK_PATH} has no AndroidManifest.xml — not a valid APK"
            exit 1
          fi
          badging="$(${ANDROID_HOME}/build-tools/34.0.0/aapt dump badging "${APK_PATH}" | head -1)"
          echo "${badging}"
          if ! grep -Fq "versionName='${BUILD_VERSION}'" <<< "${badging}"; then
            echo "::error::APK versionName does not match ${BUILD_VERSION}"
            exit 1
          fi
          signer="$(${ANDROID_HOME}/build-tools/34.0.0/apksigner verify \
            --print-certs "${APK_PATH}" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2)}')"
          if [ "${signer}" != "${DEBUG_CERT_SHA256}" ]; then
            echo "::error::APK signer ${signer} does not match stable debug certificate ${DEBUG_CERT_SHA256}"
            exit 1
          fi
          echo "APK verified: valid zip, manifest present, version ${BUILD_VERSION}, stable debug signer"

      - name: Upload the debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.APK_PATH }}
            build/build-info.txt
          retention-days: 14
          if-no-files-found: error

      - name: Summarise
        run: |
          {
            echo "### Android debug build"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo "| APK | \`${APK_PATH}\` |"
            echo "| Godot | ${GODOT_VERSION} Standard |"
            echo "| Version | \`${BUILD_VERSION}\` |"
            echo "| Source | \`${SOURCE_SHA}\` |"
            echo "| App label | \`${APP_NAME}\` |"
            echo "| Package | \`com.menno420.spiderswing.dev\` (development only) |"
            echo "| Retention | 14 days |"
            echo ""
            echo "Debug build only. NEVER reuse this public key for release or distribution."
            echo "Download it from this run's Artifacts section. The NEXT install needs"
            echo "one final uninstall because older artifacts used throwaway keys. Every"
            echo "install after this stable-key build updates in place and preserves saves."
            echo "Confirm the HUD shows"
            echo "\`BUILD ${BUILD_VERSION}\` before testing."
          } >> "$GITHUB_STEP_SUMMARY"
