# Spider Swing — Android debug APK.
#
# HOST-OWNED. Not generated by the Substrate Kit; edit it directly.
#
# Purpose: put an installable debug APK in the owner's hands on every change to
# main, so the GDD's feel gates (which can only be judged on a real device) are
# actually reachable. See ADR 0003.
#
# NOT a required merge check, deliberately: it depends on external SDK downloads,
# so making it required would turn a third-party outage into a merge block.
#
# SECRETS: this workflow reads NONE. Debug signing uses a throwaway keystore
# generated inside the run and never uploaded. There is no production signing
# material anywhere in this repository, and this workflow never publishes to
# Google Play.
#
# Every `uses:` is pinned to a full commit SHA resolved from the upstream
# repository's own git ref, with the release tag in a trailing comment.
name: android-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1
  APK_PATH: build/spider-swing-debug.apk
  ARTIFACT_NAME: spider-swing-android-debug

jobs:
  android-debug:
    name: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the engine pin matches this workflow
        run: |
          pinned="$(tr -d '[:space:]' < .godot-version)"
          echo "pinned by .godot-version: $pinned"
          if [ "$pinned" != "${GODOT_VERSION}" ]; then
            echo "::error::.godot-version says '$pinned' but android-debug.yml installs ${GODOT_VERSION}. Update both in the same change."
            exit 1
          fi

      - name: Set up JDK 17
        # Godot's current Android export documentation recommends JDK 17.
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        # Provides cmdline-tools, platform-tools, and build-tools. Godot needs
        # apksigner and zipalign from build-tools to sign and align the APK.
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Godot ${{ env.GODOT_VERSION }} Standard with export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.1
          # Standard build: GDScript only (ADR 0001).
          use-dotnet: false
          # Required here: the export needs the Android APK template.
          include-templates: true
          cache: true

      - name: Report toolchain versions
        run: |
          godot --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

      - name: Generate an ephemeral debug keystore
        # Throwaway, per-run, never uploaded, never a secret. A debug keystore
        # exists only so Android will install the APK at all; it carries no
        # trust. Godot reads these three env vars for debug signing, so no
        # editor-settings file has to be synthesised.
        run: |
          mkdir -p "${RUNNER_TEMP}/keystore"
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "${RUNNER_TEMP}/keystore/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12
          echo "generated an ephemeral debug keystore (not a secret, not uploaded)"

      - name: Export the Android Debug preset
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build

          # Import first, as a separate step. A cold export that also has to
          # import can report an import failure as an export failure, which is a
          # confusing log to debug.
          godot --headless --path . --import

          # Uses the committed "Android Debug" preset by exact name.
          godot --headless --path . --export-debug "Android Debug" "${APK_PATH}"

      - name: Prove the APK exists and is a real APK
        run: |
          set -euo pipefail
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::export reported success but ${APK_PATH} does not exist"
            ls -la build || true
            exit 1
          fi
          size="$(stat -c%s "${APK_PATH}")"
          echo "APK: ${APK_PATH} (${size} bytes)"
          # A truncated or placeholder file is worse than a missing one: it
          # uploads as a green artifact that will not install.
          if [ "${size}" -lt 1000000 ]; then
            echo "::error::${APK_PATH} is only ${size} bytes — implausibly small for a Godot APK"
            exit 1
          fi
          # An APK is a zip; prove the archive is intact and carries a manifest.
          unzip -l "${APK_PATH}" | head -20
          if ! unzip -l "${APK_PATH}" | grep -q AndroidManifest.xml; then
            echo "::error::${APK_PATH} has no AndroidManifest.xml — not a valid APK"
            exit 1
          fi
          echo "APK verified: valid zip, manifest present"

      - name: Upload the debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Summarise
        run: |
          {
            echo "### Android debug build"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo "| APK | \`${APK_PATH}\` |"
            echo "| Godot | ${GODOT_VERSION} Standard |"
            echo "| Package | \`com.menno420.spiderswing.dev\` (development only) |"
            echo "| Retention | 14 days |"
            echo ""
            echo "Debug build only. Not signed for release, not approved for Google Play."
            echo "Download it from this run's Artifacts section and install with"
            echo "\`adb install -r spider-swing-debug.apk\`."
          } >> "$GITHUB_STEP_SUMMARY"
