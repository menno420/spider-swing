# Spider Swing — Android App Bundle (.aab) for Google Play.
#
# HOST-OWNED. Not generated by the Substrate Kit; edit it directly.
#
# Purpose: produce the Android App Bundle that Google Play requires for new
# apps. Play has not accepted APK for new apps since August 2021, so the debug
# APK path in android-debug.yml can never become a submission. See ADR 0005.
#
# THIS WORKFLOW NEVER PUBLISHES. It builds an artifact and stops. Uploading to
# Google Play is an owner action taken deliberately in the Play Console, not
# something CI does on a push. It is `workflow_dispatch` only for that reason.
#
# IDENTITY IS NOT COMMITTED. `export_presets.cfg` carries deliberate placeholder
# values because a published applicationId can never be changed or reused
# (developer.android.com/build/configure-app-module). The real identifier and
# app label come from repository variables the owner sets, and this workflow
# refuses to build while they are unset.
#
# SIGNING IS OPTIONAL AND ABSENT BY DEFAULT. With no upload keystore configured
# this produces an UNSIGNED bundle — useful to prove the build works, and not
# uploadable to Play. Once the owner creates an upload key and stores it as
# secrets, the same workflow signs with it. The public debug key committed at
# .github/android/debug.keystore must NEVER be used here.
#
# Every `uses:` is pinned to a full commit SHA, with the release tag in a comment.
name: android-release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: >-
          Android versionCode for this bundle. Play requires a positive integer
          that is unique and strictly increasing per upload; a value already
          used is rejected. Leave blank to use the preset's committed value.
        required: false
        type: string
      version_name:
        description: >-
          User-visible version string. Leave blank to use the preset's value.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1
  AAB_PATH: build/spider-swing-release.aab
  ARTIFACT_NAME: spider-swing-android-release
  PRESET_NAME: Android Release
  # Placeholders committed in export_presets.cfg, replaced below.
  PLACEHOLDER_PACKAGE: com.example.PLACEHOLDER.setbyworkflow
  PLACEHOLDER_APP_NAME: PLACEHOLDER SET BY WORKFLOW
  SOURCE_SHA: ${{ github.sha }}

jobs:
  android-release:
    name: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the owner-set release identity
        # A published applicationId is permanent. Rather than guess one, this
        # workflow stops until the owner has chosen it. Failing here is the
        # designed behaviour, not a broken workflow.
        env:
          RELEASE_PACKAGE_ID: ${{ vars.RELEASE_PACKAGE_ID }}
          RELEASE_APP_NAME: ${{ vars.RELEASE_APP_NAME }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RELEASE_PACKAGE_ID}" ]; then
            echo "::error::repository variable RELEASE_PACKAGE_ID is not set."
            missing=1
          fi
          if [ -z "${RELEASE_APP_NAME}" ]; then
            echo "::error::repository variable RELEASE_APP_NAME is not set."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "Set both under Settings → Secrets and variables → Actions → Variables."
            echo "RELEASE_PACKAGE_ID is PERMANENT once published and can never be"
            echo "changed or reused. RELEASE_APP_NAME is the store-visible label"
            echo "and is limited to 30 characters by Google Play."
            exit 1
          fi
          case "${RELEASE_PACKAGE_ID}" in
            com.example.*|*PLACEHOLDER*)
              echo "::error::RELEASE_PACKAGE_ID is still an example/placeholder value."
              exit 1
              ;;
          esac
          # Play limits the store listing app name to 30 characters.
          if [ "${#RELEASE_APP_NAME}" -gt 30 ]; then
            echo "::error::RELEASE_APP_NAME is ${#RELEASE_APP_NAME} characters; Play's limit is 30."
            exit 1
          fi
          echo "release identity accepted (values not echoed)"

      - name: Assert the engine pin matches this workflow
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < .godot-version)"
          echo "pinned by .godot-version: $pinned"
          if [ "$pinned" != "${GODOT_VERSION}" ]; then
            echo "::error::.godot-version says '$pinned' but android-release.yml installs ${GODOT_VERSION}. Update both in the same change."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        # target_sdk=36 in the release preset needs platforms;android-36.
        # build-tools provides apksigner/zipalign; the NDK is listed by Godot's
        # own Android export documentation for Gradle builds.
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            build-tools;36.0.0
            platforms;android-36
            cmdline-tools;latest
            ndk;28.1.13356709

      - name: Install Godot ${{ env.GODOT_VERSION }} Standard with export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          # The Gradle/AAB path needs android_source.zip from the template set.
          include-templates: true
          cache: true

      - name: Report toolchain versions
        run: |
          godot --version
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

      - name: Apply the owner's release identity to the preset
        # export_presets.cfg is committed with placeholders on purpose. The real
        # values live in repository variables and are substituted per build, so
        # a permanent identifier is never frozen into git by an agent.
        env:
          RELEASE_PACKAGE_ID: ${{ vars.RELEASE_PACKAGE_ID }}
          RELEASE_APP_NAME: ${{ vars.RELEASE_APP_NAME }}
          IN_VERSION_CODE: ${{ inputs.version_code }}
          IN_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("export_presets.cfg")
          text = path.read_text()
          head, sep, rel = text.partition("[preset.1]")
          if not sep:
              raise SystemExit("::error::[preset.1] (Android Release) not found")

          def swap(block, key, value):
              pattern = rf'^({re.escape(key)}=).*$'
              new, n = re.subn(pattern, lambda m: m.group(1) + value, block, flags=re.M)
              if n != 1:
                  raise SystemExit(f"::error::expected exactly one {key} in the release preset, found {n}")
              return new

          rel = swap(rel, "package/unique_name", '"%s"' % os.environ["RELEASE_PACKAGE_ID"])
          rel = swap(rel, "package/name", '"%s"' % os.environ["RELEASE_APP_NAME"])
          if os.environ.get("IN_VERSION_CODE"):
              rel = swap(rel, "version/code", os.environ["IN_VERSION_CODE"])
          if os.environ.get("IN_VERSION_NAME"):
              rel = swap(rel, "version/name", '"%s"' % os.environ["IN_VERSION_NAME"])
          path.write_text(head + sep + rel)
          print("release preset identity applied")
          PY
          # Prove no placeholder survived into the build inputs.
          if grep -Fq "${PLACEHOLDER_PACKAGE}" export_presets.cfg; then
            echo "::error::placeholder package id still present after substitution"
            exit 1
          fi
          if grep -Fq "${PLACEHOLDER_APP_NAME}" export_presets.cfg; then
            echo "::error::placeholder app name still present after substitution"
            exit 1
          fi

      - name: Stage the upload keystore, when one is configured
        # Play App Signing: this key signs the BUNDLE for upload only. Google
        # holds the app signing key that signs what users install. If no upload
        # key is configured the build continues and produces an UNSIGNED bundle.
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No RELEASE_KEYSTORE_BASE64 secret — building an UNSIGNED bundle. It validates the build but cannot be uploaded to Play."
            exit 0
          fi
          install -d -m 700 "${RUNNER_TEMP}/signing"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing/upload.jks"
          chmod 600 "${RUNNER_TEMP}/signing/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "upload keystore staged"

      - name: Export the Android Release bundle
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          # All three must be set together or all three empty. Godot rejects a
          # partial config outright: "Either Release Keystore, Release User AND
          # Release Password settings must be configured OR none of them."
          # Setting PATH unconditionally while the secrets were absent is exactly
          # what failed run 30991213967.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/signing/upload.jks', runner.temp) || '' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ steps.keystore.outputs.signed == 'true' && secrets.RELEASE_KEYSTORE_USER || '' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ steps.keystore.outputs.signed == 'true' && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [ "${SIGNED}" = "true" ]; then
            python3 - <<'PY'
          import pathlib
          p = pathlib.Path("export_presets.cfg")
          head, sep, rel = p.read_text().partition("[preset.1]")
          rel = rel.replace("package/signed=false", "package/signed=true", 1)
          p.write_text(head + sep + rel)
          print("release signing enabled for this build")
          PY
          fi

          # Import separately: a cold export that also imports reports import
          # failures as export failures, which is a confusing log to debug.
          godot --headless --path . --import

          # The Gradle/AAB path needs the Android build template unpacked into
          # the project. --install-android-build-template does that in the same
          # invocation as the export.
          godot --headless --path . \
            --install-android-build-template \
            --export-release "${PRESET_NAME}" "${AAB_PATH}"

      - name: Prove the bundle exists and is a real app bundle
        run: |
          set -euo pipefail
          if [ ! -f "${AAB_PATH}" ]; then
            echo "::error::export reported success but ${AAB_PATH} does not exist"
            ls -la build || true
            exit 1
          fi
          size="$(stat -c%s "${AAB_PATH}")"
          echo "AAB: ${AAB_PATH} (${size} bytes)"
          if [ "${size}" -lt 1000000 ]; then
            echo "::error::${AAB_PATH} is only ${size} bytes — implausibly small for a Godot bundle"
            exit 1
          fi
          # An .aab is a zip with a bundle-specific layout. A file that is merely
          # present and merely a zip is not evidence it is a bundle.
          unzip -l "${AAB_PATH}" | head -30
          for entry in BundleConfig.pb base/manifest/AndroidManifest.xml; do
            if ! unzip -l "${AAB_PATH}" | grep -Fq "${entry}"; then
              echo "::error::${AAB_PATH} is missing ${entry} — not a valid Android App Bundle"
              exit 1
            fi
          done
          echo "bundle verified: zip intact, BundleConfig.pb and base manifest present"

      - name: Report the signing state honestly
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" = "true" ]; then
            echo "bundle is signed with the configured upload key"
          else
            echo "::warning::bundle is UNSIGNED — a build-validation artifact only. Google Play will reject it. Configure RELEASE_KEYSTORE_BASE64/_USER/_PASSWORD to sign."
          fi

      - name: Upload the release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.AAB_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Summarise
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          {
            echo "### Android release bundle"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo "| Bundle | \`${AAB_PATH}\` |"
            echo "| Godot | ${GODOT_VERSION} Standard |"
            echo "| Format | Android App Bundle (required by Play for new apps) |"
            echo "| Target SDK | 36 |"
            echo "| Min SDK | 24 |"
            echo "| Source | \`${SOURCE_SHA}\` |"
            if [ "${SIGNED}" = "true" ]; then
              echo "| Signing | signed with the configured upload key |"
            else
              echo "| Signing | **UNSIGNED — cannot be uploaded to Play** |"
            fi
            echo ""
            echo "This workflow does not publish. Uploading to Google Play is a"
            echo "deliberate owner action in the Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
