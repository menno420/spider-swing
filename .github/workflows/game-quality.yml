# Spider Swing — game quality gate.
#
# HOST-OWNED. This file is not generated by the Substrate Kit; edit it directly.
# (substrate-gate.yml, auto-merge-enabler.yml, and branch-sweep.yml ARE kit-owned
# and are regenerated by `bootstrap.py adopt` — never hand-edit those.)
#
# The single required quality check for game code. It runs the repository's own
# verification entry point on a clean runner with the pinned engine, and uses no
# repository secrets whatsoever.
#
# Every `uses:` below is pinned to a full commit SHA resolved from the upstream
# repository's own git ref, with the human-readable release tag in a trailing
# comment. A tag is mutable; a SHA is not.
name: game-quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. This job needs nothing but the source.
permissions:
  contents: read

# Cancel superseded runs on the same ref, but never cancel a run on main:
# main's history is the record of what actually passed.
concurrency:
  group: game-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The job id IS the check context name required by the main ruleset.
  game-quality:
    name: game-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the Substrate tooling and any future diff-scoped check
          # need real merge-base resolution, and a shallow clone silently
          # changes what those checks can see.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Assert the engine pin is what this workflow installs
        # Guards the split-brain failure: .godot-version is the source of truth
        # for tools/verify.py, and this workflow hardcodes a version for the
        # setup action. If they ever diverge, fail loudly here rather than
        # verifying against the wrong engine.
        run: |
          pinned="$(tr -d '[:space:]' < .godot-version)"
          echo "pinned by .godot-version: $pinned"
          if [ "$pinned" != "4.7.1" ]; then
            echo "::error::.godot-version says '$pinned' but game-quality.yml installs 4.7.1. Update both in the same change (and ADR 0001, which locks the engine)."
            exit 1
          fi

      - name: Install Godot 4.7.1 Standard (no .NET)
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.1
          # Standard build: Spider Swing is GDScript-only (ADR 0001).
          use-dotnet: false
          # No export templates here — this job never exports. The Android debug
          # workflow enables them because it does.
          include-templates: false
          # Caches only the engine download, which is a public immutable release.
          cache: true

      - name: Report the engine the runner actually installed
        run: godot --version

      - name: Cache Godot import data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # .godot/ is regenerated engine-derived import data — safe to cache and
          # safe to lose. No credentials, no build output, nothing from secrets.
          path: .godot
          key: godot-import-${{ runner.os }}-4.7.1-${{ hashFiles('project.godot', 'assets/**', 'game/**') }}
          restore-keys: |
            godot-import-${{ runner.os }}-4.7.1-

      - name: Verify
        # The single host verification entry point: architecture self-test,
        # architecture scan, engine version check, headless import, boot smoke
        # test, and the headless test runner. Any failure exits nonzero and
        # fails this job.
        #
        # --require-godot is what makes THIS the gate that proves the engine: a
        # missing Godot is a hard failure here, never a skip. (The kit-owned
        # substrate-gate also runs this script, because it is the repository's
        # confirmed verify_command, but that job is Python-only by design and
        # reports the engine steps as SKIPPED.) Since this job installs Godot,
        # a skip here could only mean the install silently failed — so it must
        # be an error.
        env:
          # setup-godot exports GODOT and GODOT4; verify.py probes GODOT_BIN,
          # GODOT, GODOT4, then PATH. Set GODOT_BIN explicitly so the resolution
          # order is unambiguous in the log.
          GODOT_BIN: ${{ env.GODOT }}
        run: python3 tools/verify.py --require-godot
