# Dependabot — GitHub Actions only.
#
# Actions are the only dependency ecosystem this repository has: Godot is pinned
# by .godot-version and installed by CI, GDScript has no package manager, and the
# Python tooling is stdlib-only with nothing to update.
#
# Actions are pinned to full commit SHAs, which is exactly the case Dependabot
# handles well — it bumps the SHA and updates the trailing tag comment, so the
# pin stays immutable while still receiving security fixes.
#
# IMPORTANT — kit-owned workflows: close, do not merge.
#
# Dependabot scans every file in .github/workflows/, which includes the three
# KIT-OWNED workflows (substrate-gate.yml, auto-merge-enabler.yml,
# branch-sweep.yml). Those are generated by
# `python3 bootstrap.py adopt --include-claude --wire-enforcement` and are
# regenerated in place by every adopt/upgrade, so a bump landed there is
# silently reverted the next time the kit runs — the pin drifts back with no
# signal that it happened.
#
# So: if a Dependabot PR's diff touches ONLY a kit-owned workflow, close it with
# that reason. The durable fix belongs upstream in menno420/substrate-kit, whose
# gate template should move majors; the bump then arrives here through a kit
# upgrade. (This happened on 2026-07-28 with PRs #3 and #4, both bumping
# actions/checkout and actions/setup-python inside substrate-gate.yml.)
#
# Bumps touching game-quality.yml or android-debug.yml ARE wanted and should be
# merged on green — those are host-owned and this repository controls them.
#
# Dependabot has no per-file exclude for the github-actions ecosystem, and both
# kit-owned and host-owned workflows use some of the same actions, so an
# `ignore` entry by dependency name would also suppress real bumps to the
# host-owned SHA pins. Closing the occasional un-landable PR is the cheaper
# trade, and it is a known, accepted maintenance cost rather than a solved one.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - type:infrastructure
    groups:
      # One PR for routine action bumps rather than five. Security updates still
      # arrive separately and immediately.
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
